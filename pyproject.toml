[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kr-quant"
version = "0.1.0"
description = "Point-in-time Korean equity factor backtesting project (under development)"
requires-python = ">=3.10"
dependencies = [
    "pykrx>=1.0,<2",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
